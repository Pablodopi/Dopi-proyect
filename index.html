<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOPI — Recetario Obrador</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --rosa: #F72585;
  --rosa-light: #fff0f6;
  --naranja: #FF7700;
  --amarillo: #d97706;
  --verde: #16a34a;
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface2: #f8f8fa;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --muted2: #9ca3af;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.topbar-left{display:flex;align-items:center;gap:12px}
.logo{background:var(--rosa);color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;padding:5px 14px;border-radius:100px}
.topbar-title{font-size:14px;font-weight:700}
.topbar-sub{font-size:11px;color:var(--muted);font-family:'Inter',sans-serif;margin-top:1px}
.topbar-date{font-size:11px;color:var(--muted);font-family:'Inter',sans-serif}

.main{max-width:960px;margin:0 auto;padding:24px 28px}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.card-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:'Inter',sans-serif;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title::after{content:'';flex:1;height:1px;background:var(--border)}

.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:100px;text-transform:uppercase;font-family:'Inter',sans-serif}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef9c3;color:#a16207}
.b-bad{background:#ffe4f0;color:#be185d}

.btn-p{background:var(--rosa);color:#fff;border:none;border-radius:9px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;padding:9px 16px;cursor:pointer;transition:opacity .15s}
.btn-p:hover{opacity:.85}
.btn-s{background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:9px;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;padding:9px 16px;cursor:pointer;transition:all .15s}
.btn-s:hover{border-color:var(--rosa);color:var(--rosa)}

/* RECETARIO STYLES */
.rb-tag{display:inline-flex;align-items:center;background:var(--rosa-light);color:var(--rosa);border:1px solid rgba(247,37,133,0.2);border-radius:100px;font-size:11px;font-weight:700;padding:3px 10px;font-family:'Inter',sans-serif;letter-spacing:.03em}
.rb-note-block{background:var(--surface2);border-left:3px solid var(--rosa);border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:10px}
.rb-note-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:'Inter',sans-serif;margin-bottom:6px}
.rb-note-text{font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap}
.rb-ing-table{width:100%;border-collapse:collapse}
.rb-ing-table th{padding:8px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface2);font-family:'Inter',sans-serif}
.rb-ing-table th.r{text-align:right}
.rb-ing-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.rb-ing-table tr:last-child td{border-bottom:none}
.rb-ing-table td.r{text-align:right;font-family:'Inter',sans-serif;font-weight:600}
.rb-ing-group td{background:#f3f4f6!important;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:'Inter',sans-serif;padding:6px 14px}

/* MODE TOGGLE */
.mode-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px}
.mode-btn{flex:1;padding:7px 14px;border:none;border-radius:6px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;color:var(--muted);background:none;letter-spacing:.03em}
.mode-btn.active{background:#fff;color:var(--rosa);box-shadow:0 1px 4px rgba(0,0,0,0.08)}

/* QTY ROW */
.rb-qty-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.rb-qty-row label{font-size:12px;font-weight:700;color:var(--text);flex:1}
.rb-qty-input{width:90px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--rosa);font-family:'Inter',sans-serif;font-size:20px;font-weight:800;padding:8px 10px;outline:none;text-align:center;transition:border-color .15s}
.rb-qty-input:focus{border-color:var(--rosa)}

/* PROD STRIP */
.rb-prod-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.rb-prod-kpi{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center}
.rb-prod-kpi-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:'Inter',sans-serif;margin-bottom:4px}
.rb-prod-kpi-val{font-size:20px;font-weight:800;color:var(--text);font-family:'Inter',sans-serif}
.rb-prod-kpi-val.rosa{color:var(--rosa)}
.rb-prod-kpi-val.verde{color:var(--verde)}

/* STEPS */
.rb-step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f3f4f6}
.rb-step:last-child{border-bottom:none}
.rb-step-num{width:26px;height:26px;border-radius:50%;background:var(--rosa);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Inter',sans-serif;margin-top:1px}
.rb-step-body{font-size:13px;color:var(--text);line-height:1.6;flex:1}
.rb-step-body strong{color:var(--rosa);font-weight:700}
.rb-step-body .rb-param{display:inline-block;background:var(--rosa-light);color:var(--rosa);border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;margin:1px 2px}
.rb-warn-step .rb-step-num{background:var(--naranja)}
.rb-critical-step .rb-step-num{background:#ef4444}

/* SELECTOR CARD */
.selector-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.selector-row select{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Syne',sans-serif;font-size:15px;font-weight:700;padding:10px 14px;outline:none;cursor:pointer;appearance:none}
.selector-row select:focus{border-color:var(--rosa)}

@media(max-width:640px){
  .main{padding:16px}
  .rb-prod-strip{grid-template-columns:1fr 1fr}
  .selector-row{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">DOPI</span>
    <div>
      <div class="topbar-title">Recetario Obrador</div>
      <div class="topbar-sub">Fichas técnicas · Escalado · Paso a paso</div>
    </div>
  </div>
  <div class="topbar-date" id="today-date"></div>
</div>

<div class="main">

  <!-- SELECTOR CARD -->
  <div class="card">
    <div class="card-title">Receta activa</div>
    <div class="selector-row">
      <div style="flex:1;min-width:200px">
        <div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:'Inter',sans-serif;margin-bottom:6px">Seleccionar receta</div>
        <select id="rb-selector" onchange="rbLoad()"></select>
      </div>
    </div>
  </div>

  <!-- QTY ROWS -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
    <div class="rb-qty-row" style="margin-bottom:0">
      <label>¿Cuánto vas a producir?</label>
      <div class="mode-toggle" style="margin-right:4px">
        <button class="mode-btn active" id="rb-mode-uds" onclick="setRbMode('uds')">Uds</button>
        <button class="mode-btn" id="rb-mode-kg" onclick="setRbMode('kg')">Kg</button>
      </div>
      <input class="rb-qty-input" type="text" id="rb-qty" value="12" oninput="rbLoad()">
      <span style="font-size:13px;color:var(--muted);font-family:'Inter',sans-serif" id="rb-qty-unit">uds</span>
    </div>
    <div class="rb-qty-row" style="margin-bottom:0">
      <label>Peso por porción</label>
      <input class="rb-qty-input" type="text" id="rb-peso" value="140" oninput="rbLoad()" style="width:80px">
      <span style="font-size:13px;color:var(--muted);font-family:'Inter',sans-serif">g</span>
    </div>
  </div>

  <!-- VIEWER -->
  <div id="rb-viewer">
    <div style="text-align:center;padding:60px 20px;color:var(--muted)">
      <div style="font-size:48px;margin-bottom:12px">📖</div>
      <div>Selecciona una receta arriba</div>
    </div>
  </div>

</div>

    tecnica:'MANTEQUILLA FRIA EN CUBOS — directamente de nevera, cubos de 2cm. Fria es clave para el crujiente — controla la expansion en horno. NO a temperatura ambiente para este formato.\\n\\nAZUCARES ratio invertido: 65% blanco / 35% moreno. El blanco carameliza y da rigidez al enfriarse.\\nSIN LEVADURA ni MAIZENA.\\nCHIPS EN SUPERFICIE DESPUES DE EXTENDER — nunca en la masa. Los chips en la masa impiden extender bien.\\n\\nPROCESO:\\nPaso 1: Cremar mantequilla pomada + azucares pala plana vel.4 → 2min maximo. Mezcla homogenea y suave. No airear — mas tiempo hace la masa esponjosa.\\nPaso 2: Huevos uno a uno vel.2, luego vainilla. Vel.4 → 30seg.\\nPaso 3: Harina + bicarbonato + sal vel.1 → 45seg. Masa limpia SIN CHIPS.\\nPaso 4: Cold rest nevera minimo 1h.\\n\\nMETODO A — lamina cortada (local):\\nPaso 5: Extender masa entre dos papeles de horno con rodillo a 10-11mm exacto. Usar listones guia de igual grosor a ambos lados.\\nPaso 6: Nevera 15-20min hasta que la lamina este firme.\\nPaso 7: Repartir chips o chunks partidos en superficie y presionar suavemente con la palma — solo incrustar, no aplanar mas.\\nPaso 8: Cortar rectangulos 8x3cm con cuchillo largo sin mover las piezas.\\nPaso 9: Congelar en bandeja plana 2h hasta solidas. Embolsar con papel entre capas.\\n\\nMETODO B — rulo (obrador):\\nPaso 5: Formar rulo de masa limpia SIN CHIPS, 10cm ancho x 3cm alto. Envolver en film apretado. Congelar 3h hasta solido.\\nPaso 6: Cortar lonchas 10-11mm desde congelado con cuchillo de sierra.\\nPaso 7: Presionar chips o chunks en superficie de cada loncha ya cortada.\\nPaso 8: Recongelar 30min. Embolsar con papel entre capas.\\n\\nOPCION PREMIUM: chocolate picado grueso o chunks partidos a la mitad en superficie. Mas impacto visual y mas chocolate por mordisco.',
horneado:'HORNEAR SIEMPRE DESDE CONGELADO — nunca descongelar antes.\nConvencional: 160°C 20-25 min. Ventilado: 150°C 18-22 min.\nTemperatura baja y tiempo largo — deshidrata lentamente sin quemar el exterior.\nSenal de punto: superficie mate y dorada uniforme, bordes ligeramente mas oscuros, aspecto seco.\nDEJAR ENFRIAR COMPLETAMENTE EN BANDEJA antes de mover o servir. El crujiente se desarrolla al enfriarse. En caliente la pieza se dobla y rompe.\nServir siempre frio o temperatura ambiente. El dip va separado para mojar, no para untar directo.'
  }

    tecnica:'MANTEQUILLA POMADA — sacar de nevera 2h antes. NO fria. Con mantequilla fria la masa sale pegajosa e inmanejable.\\n\\nCOLOR EQUILIBRADO — el colorante va reducido a 4g (vs 8g en la cookie estandar). Con mantequilla pomada el colorante se integra diferente y con menos cantidad consigues un rojo-rosado elegante, no agresivo. Si quieres mas intensidad de color puedes subir a 6g, nunca mas de 6g en este formato.\\n\\nCacao suave NO alcalinizado a solo 12g — el cacao en exceso apaga el color rojo. A 12g da profundidad de sabor sin interferir con el color.\\n\\nSIN LEVADURA ni MAIZENA. CHUNKS EN SUPERFICIE una vez extendida la lamina, no en la masa.\\n\\nPROCESO:\\n1. Cremar mantequilla FRIA en cubos + azucares pala plana vel.1 → 1min · vel.2 → 2min. Mezcla arenosa. NO usar velocidades altas.\\n2. Huevos uno a uno vel.2, luego vainilla. Vel.4 → 30seg.\\n3. Con mixer en marcha vel.2, añadir colorante gel. Maximo 20seg hasta color uniforme.\\n4. Harina + cacao tamizado + bicarbonato + sal, vel.1 → 45seg.\\n5. Cold rest nevera minimo 1h con masa limpia y SIN CHUNKS — los chunks van en superficie despues de extender, no en la masa.\\n\\nMETODO A — lamina cortada (local):\\nPaso 6: Extender masa entre dos papeles de horno con rodillo a 10-11mm exacto.\\nPaso 7: Nevera 15-20min hasta que la lamina este firme.\\nPaso 8: Presionar chunks de chocolate blanco en superficie suavemente con la palma.\\nPaso 9: Cortar rectangulos 8x3cm con cuchillo largo sin mover las piezas.\\nPaso 10: Congelar en bandeja plana 2h. Embolsar con papel entre capas.\\n\\nMETODO B — rulo (obrador):\\nPaso 6: Formar rulo de masa limpia SIN CHUNKS, 10cm x 3cm. Envolver en film. Congelar 3h.\\nPaso 7: Cortar lonchas 10-11mm desde congelado con cuchillo de sierra.\\nPaso 8: Presionar chunks de chocolate blanco en superficie de cada loncha.\\nPaso 9: Recongelar 30min. Embolsar con papel entre capas.',

let rbMode = 'uds';
const BASE_N = 12;

function setRbMode(mode){
  rbMode = mode;
  document.getElementById('rb-mode-uds').classList.toggle('active', mode==='uds');
  document.getElementById('rb-mode-kg').classList.toggle('active', mode==='kg');
  document.getElementById('rb-qty-unit').textContent = mode==='kg' ? 'kg' : 'uds';
  document.getElementById('rb-qty').value = mode==='kg' ? '1' : '12';
  rbLoad();
}

function rbLoad(){
  const sel = document.getElementById('rb-selector');
  if(!sel) return;
  const id = sel.value;
  const r = recetas.find(x => x.id === id);
  if(!r){
    document.getElementById('rb-viewer').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">📖</div><div>Selecciona una receta</div></div>';
    return;
  }

  const rbQtyRaw = pf(document.getElementById('rb-qty').value) || 12;
  const PESO_G   = pf(document.getElementById('rb-peso').value) || 140;

  const totalMasaBase = r.ings.filter(i => i.unidad === 'g').reduce((s,i) => s + i.cantidad, 0);

  const factor = rbMode === 'kg'
    ? (rbQtyRaw * 1000) / (totalMasaBase || 1)
    : (Math.max(1, parseInt(rbQtyRaw) || 12)) / BASE_N;
  const qty = rbMode === 'kg'
    ? Math.round(factor * BASE_N)
    : Math.max(1, parseInt(rbQtyRaw) || 12);

  const GRP_COLORS = {
    'Humedo':'#F72585','Húmedos':'#F72585','Secos':'#6366f1','Mix-ins':'#78350f',
    'Relleno':'#0ea5e9','Dips':'#0ea5e9','Topping':'#0ea5e9',
    'Superficie':'#9333ea','Salsa Halloween':'#ef4444','Otros':'#64748b'
  };

  // KPIs
  const totalMasaScaled = Math.round(totalMasaBase * factor);
  const pesoHorneado = Math.round(PESO_G * 0.84);
  const coldRestRec = r.id === 'dopi-limon' ? '48-72h' :
                      r.id === 'dopi-brownie' ? '2-4h' : '24-48h';

  function kpi(label, val, cls){
    return '<div class="rb-prod-kpi"><div class="rb-prod-kpi-label">'+label+'</div>'
      + '<div class="rb-prod-kpi-val '+cls+'">'+val+'</div></div>';
  }

  const kpiHtml = '<div class="rb-prod-strip">'
    + kpi('Unidades', qty, 'rosa')
    + kpi('Masa total', totalMasaScaled+'g', '')
    + kpi('Peso/cookie', PESO_G+'g masa', '')
    + kpi('Cold rest', coldRestRec, 'verde')
    + '</div>';

  // Ingredients table
  const grupos = {};
  r.ings.forEach(ing => {
    if(!grupos[ing.grupo]) grupos[ing.grupo] = [];
    grupos[ing.grupo].push(ing);
  });
  const harinaIng = r.ings.find(i => i.nombre.toLowerCase().includes('harina'));
  const baseG = harinaIng ? harinaIng.cantidad : null;

  let ingRows = '';
  Object.entries(grupos).forEach(([grp, ings]) => {
    const dot = GRP_COLORS[grp] || '#94a3b8';
    ingRows += '<tr class="rb-ing-group"><td colspan="5">'+grp+'</td></tr>';
    ings.forEach(ing => {
      const pct = (baseG && ing.unidad === 'g') ? ((ing.cantidad/baseG)*100).toFixed(1)+'%' : '—';
      const scaled = ing.unidad === 'g'   ? Math.round(ing.cantidad * factor) + 'g'
                   : ing.unidad === 'ml'  ? Math.round(ing.cantidad * factor) + 'ml'
                   : ing.unidad === 'uds' ? Math.ceil(ing.cantidad * factor) + ' uds'
                   : '—';
      ingRows += '<tr>'
        + '<td><div style="display:flex;align-items:center;gap:8px">'
        + '<span style="width:7px;height:7px;border-radius:50%;background:'+dot+';flex-shrink:0;display:inline-block"></span>'
        + '<span style="font-weight:600">'+ing.nombre+'</span></div></td>'
        + '<td class="r" style="color:var(--muted);font-size:12px">'+ing.cantidad+' '+ing.unidad+'</td>'
        + '<td class="r" style="font-size:16px;font-weight:700;color:var(--rosa)">'+scaled+'</td>'
        + '<td class="r" style="color:var(--muted)">'+ing.unidad+'</td>'
        + '<td class="r" style="color:var(--muted2);font-size:12px">'+pct+'</td>'
        + '</tr>';
    });
  });
  const totalScaled = Math.round(totalMasaBase * factor);
  ingRows += '<tr style="background:var(--rosa-light);border-top:2px solid rgba(247,37,133,0.2)">'
    + '<td colspan="2" style="font-weight:700;font-family:Inter,sans-serif;color:var(--rosa)">MASA TOTAL</td>'
    + '<td class="r" style="font-weight:700;font-family:Inter,sans-serif;color:var(--rosa);font-size:16px">'+totalScaled+'g</td>'
    + '<td colspan="2"></td></tr>';

  const ingTable = '<div style="overflow-x:auto"><table class="rb-ing-table">'
    + '<thead><tr><th>Ingrediente</th><th class="r" style="color:var(--muted2)">Base 12</th>'
    + '<th class="r" style="color:var(--rosa)">Para '+qty+' uds</th>'
    + '<th class="r">Unidad</th><th class="r">Baker’s%</th></tr></thead>'
    + '<tbody>'+ingRows+'</tbody></table></div>';

  // Steps
  const steps = buildSteps(r, qty, factor, PESO_G, coldRestRec);
  const stepsHtml = '<div class="card" style="margin-bottom:14px;padding:0;overflow:hidden">'
    + '<div style="background:var(--surface2);padding:12px 18px;border-bottom:1px solid var(--border)">'
    + '<span style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">📋 Paso a paso — '+qty+' cookies</span></div>'
    + '<div style="padding:16px 18px">'
    + steps.map((s,i) => {
        const cls = s.warn ? 'rb-warn-step' : s.critical ? 'rb-critical-step' : '';
        return '<div class="rb-step '+cls+'">'
          + '<div class="rb-step-num">'+(i+1)+'</div>'
          + '<div class="rb-step-body">'+s.text+'</div>'
          + '</div>';
      }).join('')
    + '</div></div>';

  // Horneado
  const hornHtml = r.horneado ? '<div class="card" style="padding:0;overflow:hidden">'
    + '<div style="background:var(--surface2);padding:12px 18px;border-bottom:1px solid var(--border)">'
    + '<span style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">🔥 Horneado — parámetros</span></div>'
    + '<div style="padding:16px 18px">'+buildHorneado(r, qty, PESO_G)+'</div></div>' : '';

  const tagPreset = r.preset
    ? '<span class="rb-tag">⭐ Receta DOPI</span>'
    : '<span class="rb-tag" style="background:#f0fdf4;color:#15803d;border-color:rgba(21,128,61,0.2)">Mis recetas</span>';

  const isHalloween = r.id === 'dopi-halloween';
  const isTiramisu  = r.id === 'dopi-tiramisu';
  const extraTag = isHalloween ? '<span class="rb-tag" style="background:#1a0a00;color:#f97316;border-color:rgba(249,115,22,0.3);margin-left:6px">🎃 Halloween</span>'
                : isTiramisu  ? '<span class="rb-tag" style="background:#f0fdf4;color:#15803d;border-color:rgba(21,128,61,0.2);margin-left:6px">Edición Octubre</span>'
                : '';

  document.getElementById('rb-viewer').innerHTML =
    '<div class="card" style="margin-bottom:14px">'
    + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap">'
    + '<div><div style="font-size:20px;font-weight:800;margin-bottom:5px">'+r.nombre+'</div>'
    + '<div style="font-size:13px;color:var(--muted);line-height:1.5">'+r.desc+'</div></div>'
    + '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap">'+tagPreset+extraTag+'</div></div>'
    + kpiHtml + ingTable + '</div>'
    + stepsHtml + hornHtml;
}

function p(text){ return '<span class="rb-param">'+text+'</span>'; }

function buildSteps(r, qty, factor, pesoG, coldRest){
  const masaG = Math.round(r.ings.filter(i=>i.unidad==='g').reduce((s,i)=>s+i.cantidad,0)*factor);
  const isBrownie = r.id === 'dopi-brownie';
  const isFries   = r.id.includes('fries');

  if(isFries){
    const isRV    = r.id === 'dopi-fries-redvelvet';
    const isChoco = r.id === 'dopi-fries-chocolate';
    const mixinName = isRV    ? 'chunks de chocolate blanco'
                    : isChoco ? 'chips dark 54%'
                    : 'chips o chunks partidos';
    const steps = [];
    steps.push({text:'<strong>Mantequilla FRÍA en cubos</strong> — '+p('2cm de lado')+', directamente de nevera. La mantequilla fría controla la expansión en horno y da la estructura crujiente. '+p('NO a temperatura ambiente')+' para este formato.', warn:true});
    steps.push({text:'<strong>Pesar ingredientes</strong> — '+p(masaG+'g masa total')+' para '+p(qty+' piezas')+'. Báscula obligatoria.'});
    steps.push({text:'<strong>Cremado</strong> — KitchenAid pala plana. Mantequilla '+p('FRÍA en cubos')+' + azúcares. '+p('Vel.1 → 1min')+' · '+p('Vel.2 → 2min')+'. Resultado: textura arenosa. NO usar velocidades altas.'});
    if(isRV){
      steps.push({text:'<strong>Huevos</strong> — '+p('Vel.2')+', uno a uno, luego vainilla. '+p('Vel.4 → 30seg')+'.'});
      steps.push({text:'<strong>Colorante</strong> — con mixer en marcha '+p('Vel.2')+', añadir colorante gel. Máximo '+p('20seg')+' hasta color uniforme.', warn:true});
      steps.push({text:'<strong>Secos</strong> — harina + cacao tamizado + bicarbonato + sal. '+p('Vel.1 → 45seg')+'. Masa limpia '+p('SIN CHUNKS')+'.'});
    } else if(isChoco){
      steps.push({text:'<strong>Huevos</strong> — '+p('Vel.2')+', uno a uno, luego vainilla. '+p('Vel.4 → 30seg')+'.'});
      steps.push({text:'<strong>Secos</strong> — harina + cacao Valrhona '+p('TAMIZADO')+' + bicarbonato + sal. '+p('Vel.1 → 50seg')+'. Masa limpia '+p('SIN CHIPS')+'.'});
    } else {
      steps.push({text:'<strong>Huevos</strong> — '+p('Vel.2')+', uno a uno, luego vainilla. '+p('Vel.4 → 30seg')+'.'});
      steps.push({text:'<strong>Secos</strong> — harina + bicarbonato + sal. '+p('Vel.1 → 45seg')+'. Masa limpia '+p('SIN CHIPS')+'.'});
    }
    steps.push({text:'<strong>Cold rest</strong> — nevera '+p('mínimo 1h')+' con masa limpia y sin mix-ins. La masa fría es mucho más manejable para extender.', warn:true});
    steps.push({text:'<strong>Extender</strong> — entre dos papeles de horno con rodillo a '+p('8–10mm exacto')+'. Usar listones guía de igual grosor a ambos lados.'});
    steps.push({text:'<strong>Enfriar lámina</strong> — nevera '+p('15–20min')+' hasta que la lámina esté firme al tacto.'});
    steps.push({text:'<strong>Mix-ins en superficie</strong> — repartir '+mixinName+' sobre la lámina y presionar suavemente con la palma. Solo incrustar, no aplanar más la masa.', warn:true});
    steps.push({text:'<strong>Cortar</strong> — rectángulos de '+p('8×3cm')+' con cuchillo largo. Cortar directo sin mover las piezas.'});
    steps.push({text:'<strong>Congelar</strong> — piezas en bandeja plana sin tocarse, '+p('2h')+' hasta completamente sólidas.'});
    steps.push({text:'<strong>Embolsar</strong> — bolsa zip con papel de horno entre capas. Etiquetar: '+p('DOPI · '+r.nombre+' · Fecha')+'.'});
    return steps;
  }

  if(isBrownie){
    return [
      {text:'<strong>Fundir</strong> mantequilla + chocolate negro a baño María o microondas (30 seg intervals). Remover hasta liso. Dejar enfriar a '+p('~40°C')+'antes de continuar.'},
      {text:'<strong>Azúcares</strong> — mezclar manualmente la mezcla de chocolate enfriada con ambos azúcares en bol grande hasta integrar.'},
      {text:'<strong>Huevos</strong> — añadir '+p(Math.ceil(3*factor)+' huevos')+' uno a uno con varilla o KitchenAid pala plana '+p('vel.3')+' durante '+p('3 min')+'. La mezcla debe quedar brillante y espesa.', warn:true},
      {text:'<strong>Vainilla</strong> — incorporar el extracto y mezclar brevemente.'},
      {text:'<strong>Secos</strong> — tamizar harina+cacao+sal. Incorporar con espátula en 3 adiciones, '+p('15–20 pliegues')+'. La masa quedará muy densa.'},
      {text:'<strong>Mix-ins</strong> — chips/chunks de chocolate a mano, '+p('10 pliegues')+'.'},
      {text:'<strong>Cold rest</strong> — cubrir con film a contacto. Refrigerar '+p(coldRest)+'. La masa se endurece — es normal y necesario.', warn:true},
      {text:'<strong>Porcionar</strong> — '+p(qty+' porciones × '+pesoG+'g')+' con báscula. Manos enharinadas (masa muy pegajosa). Formar bola.', warn:true},
      {text:'<strong>Pre-congelado</strong> — bolas en bandeja plana sin tocarse. Congelar '+p('2h destapadas')+' hasta sólidas.'},
      {text:'<strong>Embolsar</strong> — bolsa zip con papel entre capas. Etiquetar: '+p('DOPI · Brownie · Fecha')+'.'},
    ];
  }

  const hasColorante = r.ings.some(i => i.nombre.toLowerCase().includes('colorante'));
  const hasLimon     = r.ings.some(i => i.nombre.toLowerCase().includes('limón') || i.nombre.toLowerCase().includes('limon'));
  const hasCacao     = r.ings.some(i => i.nombre.toLowerCase().includes('cacao en polvo'));
  const hasMaizena   = r.ings.some(i => i.nombre.toLowerCase().includes('maizena'));
  const hasCafe      = r.ings.some(i => i.nombre.toLowerCase().includes('espresso') || i.nombre.toLowerCase().includes('café'));

  const secosList = hasCacao
    ? (hasMaizena ? 'harina + maizena + cacao tamizado + bicarbonato + levadura + sal'
                  : hasCafe ? 'harina + espresso en polvo + bicarbonato + levadura + sal'
                  : 'harina + cacao tamizado + bicarbonato + levadura + sal')
    : (hasMaizena ? 'harina + maizena + bicarbonato + levadura + sal'
      : hasCafe   ? 'harina + espresso en polvo + bicarbonato + levadura + sal'
                  : 'harina + bicarbonato + levadura + sal');

  const steps = [];
  steps.push({text:'<strong>Pesar ingredientes</strong> — '+p(masaG+'g masa total')+' para '+p(qty+' cookies')+'. Báscula obligatoria. Mantequilla a '+p('4–8°C')+'.'});
  steps.push({text:'<strong>Secos</strong> — mezclar '+secosList+' en un bol. Reservar.'});
  steps.push({text:'<strong>Cremado</strong> — KitchenAid pala plana. Mantequilla fría en cubos + azúcares. '+p('Vel.1 → 1min')+' · '+p('Vel.3 → 2min')+' · '+p('Vel.4 → 2min')+'. Resultado: textura arenosa-grumosa. NO cremosa.', critical:true});

  if(hasLimon){
    steps.push({text:'<strong>Huevos + aromáticos</strong> — '+p('Vel.2')+', huevos uno a uno, luego vainilla, ralladura de limón y zumo. '+p('Vel.4 → 45seg')+'. La mezcla puede parecer cortada — es normal.'});
  } else if(hasColorante){
    steps.push({text:'<strong>Huevos</strong> — '+p('Vel.2')+', huevos uno a uno, luego vainilla. '+p('Vel.4 → 45seg')+'.'});
    steps.push({text:'<strong>Colorante</strong> — con mixer en marcha '+p('Vel.2')+', añadir colorante gel. Máximo '+p('30seg')+' hasta color uniforme. No sobrebatir.', warn:true});
  } else {
    steps.push({text:'<strong>Huevos</strong> — '+p('Vel.2')+', huevos uno a uno, luego la vainilla. '+p('Vel.4 → 45seg')+'. Raspar paredes del bol.'});
  }

  steps.push({text:'<strong>Harina</strong> — '+p('Vel.1 mínima')+'. Añadir secos de una vez. Mezclar '+p('30–45seg')+' hasta que no haya harina visible. PARAR inmediatamente.', critical:true});

  const hasMixins = r.ings.some(i => i.grupo === 'Mix-ins');
  if(hasMixins){
    steps.push({text:'<strong>Mix-ins</strong> — retirar bol de la máquina. Incorporar chocolate a mano con espátula, '+p('10–15 pliegues')+'. Dejar trozos visibles.'});
  }

  steps.push({text:'<strong>Cold rest</strong> — cubrir con film a contacto. Refrigerar '+p(coldRest)+'. Este paso no es opcional — define la textura y el sabor final.', warn:true});
  steps.push({text:'<strong>Porcionar</strong> — '+p(qty+' porciones × '+pesoG+'g')+'. Báscula obligatoria. Formar bolas altas (más altas que anchas).'});
  steps.push({text:'<strong>Pre-congelado</strong> — bolas en bandeja plana sin tocarse. Congelar '+p('2h destapadas')+' hasta completamente sólidas.'});
  steps.push({text:'<strong>Embolsar</strong> — bolsa zip con papel de horno entre capas. Etiquetar: '+p('DOPI · '+r.nombre.split('—')[0].trim()+' · Fecha')+'.'});
  return steps;
}

function buildHorneado(r, qty, pesoG){
  const lines = r.horneado.split('\n');
  const bandejaUds = 6;
  const bandejas = Math.ceil(qty / bandejaUds);
  const pesoHorneado = Math.round(pesoG * 0.84);

  function kpi(label, val, cls){
    return '<div class="rb-prod-kpi"><div class="rb-prod-kpi-label">'+label+'</div>'
      + '<div class="rb-prod-kpi-val '+cls+'">'+val+'</div></div>';
  }

  let html = '<div class="rb-prod-strip" style="margin-bottom:12px">'
    + kpi('Cookies/bandeja', 'máx '+bandejaUds, '')
    + kpi('Bandejas necesarias', bandejas, 'rosa')
    + kpi('Peso horneado/ud', '~'+pesoHorneado+'g', '')
    + kpi('Desde congelado', 'sin descongelar', 'verde')
    + '</div>';

  lines.forEach(line => {
    if(!line.trim()) return;
    html += '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f3f4f6">'
      + '<span style="font-size:16px;flex-shrink:0">🔥</span>'
      + '<span style="font-size:13px;color:var(--text);line-height:1.6">'+line+'</span></div>';
  });
  return html;
}

function init(){
  // Date
  const d = new Date();
  const el = document.getElementById('today-date');
  if(el) el.textContent = d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  // Populate selector
  const sel = document.getElementById('rb-selector');
  if(!sel) return;
  recetas.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = (r.preset ? '⭐ ' : '') + r.nombre;
    sel.appendChild(opt);
  });
  rbLoad();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
